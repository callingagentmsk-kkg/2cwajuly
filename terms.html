<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms & Conditions | CWA SCIENCE CLASSES</title>
<meta name="description" content="Terms & Conditions for CWA SCIENCE CLASSES - Concept with Abhishek.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  body{ min-width:0 !important; }
  .legal-wrap{ max-width:820px; margin:0 auto; padding:110px 20px 80px; }
  .legal-wrap h1{ font-family:'Baloo 2',sans-serif; font-size:2rem; color:var(--dark); margin-bottom:8px; }
  .legal-wrap .updated{ color:var(--gray); font-size:.85rem; margin-bottom:30px; }
  .legal-content{ background:#fff; border-radius:18px; box-shadow:var(--shadow-soft); padding:32px; line-height:1.9; color:#333; white-space:pre-line; }
  .legal-back{ display:inline-flex; align-items:center; gap:8px; margin-bottom:20px; font-weight:700; color:var(--primary); }
</style>
</head>
<body>
<div class="legal-wrap">
  <a href="index.html" class="legal-back"><i class="fa-solid fa-arrow-left"></i> Home Par Wapas Jayein</a>
  <h1><i class="fa-solid fa-file-contract"></i> Terms &amp; Conditions</h1>
  <p class="updated">CWA SCIENCE CLASSES — Concept with Abhishek</p>
  <div class="legal-content" id="legalContent">Loading...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/site-data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  let content = SITE_SETTINGS_DEFAULT.terms_content;
  if (typeof IS_SUPABASE_CONFIGURED !== 'undefined' && IS_SUPABASE_CONFIGURED) {
    try {
      const { data } = await supabaseClient.from('site_settings').select('data').eq('id', 1).single();
      if (data && data.data && data.data.terms_content) content = data.data.terms_content;
    } catch (e) {}
  }
  document.getElementById('legalContent').textContent = content;
});
</script>
</body>
</html>
